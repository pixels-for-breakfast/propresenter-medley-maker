[workspace]
resolver = "2"
members = [
    "propresenter-parser",
    "medley-core", 
    "medley-cli",
    "medley-gui"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.24"
egui = "0.24"
egui_extras = { version = "0.24", features = ["all_loaders"] }
rfd = "0.12"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Menno-Paul Schreuder <menno@pixelsforbreakfast.nl>"]